<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mental Ascend — Csúcsforma. Fejben is. Hamarosan." />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="icon" type="image/svg+xml" href="../pics/favicon.svg" />
  <title>MENTAL ASCEND. — Hamarosan</title>
  <style>
    :root {
      --black: #0b0b0b;
      --gold: #d7aa3d;
      --gold-light: #f0ce73;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 32px;
      background:
        radial-gradient(circle at 77% 42%, rgba(215, 170, 61, .35) 0%, rgba(215, 170, 61, .09) 18%, transparent 42%),
        linear-gradient(128deg, #070707 0%, #111111 46%, #19120a 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(80vw, 900px);
      height: min(80vw, 900px);
      right: -22vw;
      bottom: -48vw;
      border: 1px solid rgba(240, 206, 115, .48);
      transform: rotate(42deg);
    }

    .page::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(110deg, transparent 40%, rgba(215, 170, 61, .10) 61%, transparent 78%);
    }

    .content {
      width: min(100%, 820px);
      text-align: center;
    }

    .logo {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: .83;
      text-transform: uppercase;
    }

    .logo-mental {
      margin-bottom: 11px;
      color: var(--gold-light);
      font-size: clamp(.76rem, 1.7vw, 1.1rem);
      font-weight: 500;
      letter-spacing: .46em;
      text-indent: .46em;
    }

    .logo-ascend {
      color: var(--white);
      font-size: clamp(2.3rem, 8vw, 5.4rem);
      font-weight: 900;
      letter-spacing: -.065em;
    }

    .logo-square {
      display: inline-block;
      width: .125em;
      height: .125em;
      margin-left: .10em;
      margin-bottom: .12em;
      vertical-align: baseline;
      background: var(--gold-light);
    }

    h1 {
      margin: clamp(3.8rem, 10vw, 6.4rem) 0 0;
      font-size: clamp(2.8rem, 8.8vw, 6.7rem);
      font-weight: 900;
      line-height: .9;
      letter-spacing: -.075em;
      text-transform: uppercase;
    }

    h1 span { color: var(--gold-light); }

    .soon {
      margin: 28px 0 0;
      color: rgba(255,255,255,.74);
      font-size: clamp(.78rem, 1.8vw, 1rem);
      font-weight: 700;
      letter-spacing: .32em;
      text-indent: .32em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .page { padding: 24px; }
      h1 { margin-top: 4.5rem; }
      .page::before { width: 115vw; height: 115vw; right: -48vw; bottom: -52vw; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="content" aria-label="Mental Ascend hamarosan">
      <div class="logo" aria-label="Mental Ascend">
        <div class="logo-mental">MENTAL</div>
        <div class="logo-ascend">ASCEND<span class="logo-square" aria-hidden="true"></span></div>
      </div>

      <h1>Csúcsforma.<br /><span>Fejben is.</span></h1>
      <p class="soon">Hamarosan...</p>
    </section>
  </main>
</body>
</html>
